name: Deploy staging

# Отдельный от deploy.yml триггер и job: пуш в staging не задевает прод-workflow
# (тот слушает только push:main), и наоборот.
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      # Выкладка только после lint и smoke (0084-a): красный шаг — rsync не запускается.
      - run: npm run lint
      - run: npm run build
        env:
          # Тот же относительный /api, что и на проде: nginx стейдж-поддомена
          # проксирует /api на стейдж-бэк и раздаёт эту же статику — один origin.
          VITE_API_BASE: /api

      - name: Браузер для smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke на собранном dist
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          SMOKE_BASE_URL=http://127.0.0.1:4173 npm run test:smoke

      - name: Скриншоты smoke при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: test-results/
          if-no-files-found: ignore

      - name: Deploy over SSH (staging)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key_staging
          chmod 600 ~/.ssh/deploy_key_staging
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key_staging" dist/ "$SSH_USER@$SSH_HOST:/var/www/soborbum-frontend-staging/dist/"
